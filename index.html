<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-900 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Scanner Pro</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- html5-qrcode Library -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
    }
    /* Dynamic Scanner Animation */
    .scan-laser {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, transparent, #3b82f6, #60a5fa, #3b82f6, transparent);
      box-shadow: 0 0 15px #3b82f6, 0 0 8px #60a5fa;
      animation: scan 2.5s infinite ease-in-out;
    }
    @keyframes scan {
      0% { top: 0%; opacity: 0.8; }
      50% { top: 96%; opacity: 1; }
      100% { top: 0%; opacity: 0.8; }
    }
    /* Custom html5-qrcode video styling */
    #reader video {
      object-fit: cover !important;
      border-radius: 1rem;
      width: 100% !important;
      height: 100% !important;
    }
    #reader {
      border: none !important;
    }
  </style>
</head>
<body class="h-full flex flex-col justify-between items-center min-h-screen p-4 sm:p-6 md:p-8">

  <!-- Toast Notification System -->
  <div id="toast" class="fixed top-5 right-5 z-50 transform translate-y-[-150%] transition-all duration-300 ease-out bg-slate-800 text-white px-5 py-3 rounded-xl shadow-2xl border border-slate-700 flex items-center gap-3">
    <i id="toast-icon" data-lucide="check-circle-2" class="w-5 h-5 text-emerald-400"></i>
    <span id="toast-message" class="text-sm font-medium">Notification</span>
  </div>

  <!-- Header -->
  <header class="w-full max-w-xl text-center mb-4">
    <div class="inline-flex items-center justify-center p-3 bg-blue-600/10 rounded-2xl border border-blue-500/20 mb-3 text-blue-400">
      <i data-lucide="qr-code" class="w-8 h-8"></i>
    </div>
    <h1 class="text-2xl sm:text-3xl font-bold bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
      Scanner QR Code
    </h1>
    <p class="text-slate-400 text-sm mt-1">Numérisez en temps réel ou importez une image</p>
  </header>

  <!-- Main Container -->
  <main class="w-full max-w-xl flex-1 flex flex-col items-center justify-center gap-6">

    <!-- Mode Selector Tabs -->
    <div class="w-full bg-slate-800/80 p-1.5 rounded-2xl border border-slate-700/60 flex items-center backdrop-blur-md">
      <button id="tab-camera" onclick="switchTab('camera')" class="flex-1 py-2.5 px-4 rounded-xl text-sm font-semibold flex items-center justify-center gap-2 transition-all bg-blue-600 text-white shadow-lg">
        <i data-lucide="camera" class="w-4 h-4"></i>
        <span>Caméra</span>
      </button>
      <button id="tab-file" onclick="switchTab('file')" class="flex-1 py-2.5 px-4 rounded-xl text-sm font-semibold flex items-center justify-center gap-2 transition-all text-slate-400 hover:text-white">
        <i data-lucide="image" class="w-4 h-4"></i>
        <span>Fichier Image</span>
      </button>
    </div>

    <!-- Scanner Container -->
    <div class="w-full bg-slate-800/50 rounded-3xl p-4 sm:p-6 border border-slate-700/50 shadow-2xl flex flex-col items-center justify-center relative overflow-hidden backdrop-blur-sm min-h-[320px]">
      
      <!-- View 1: Live Camera Scan -->
      <div id="view-camera" class="w-full flex flex-col items-center justify-center relative">
        <div class="relative w-full aspect-square max-w-[320px] rounded-2xl overflow-hidden bg-slate-900 border-2 border-slate-700 shadow-inner">
          <div id="reader" class="w-full h-full"></div>
          
          <!-- Animated Laser overlay when active -->
          <div id="scanner-laser" class="scan-laser hidden pointer-events-none z-10"></div>
          
          <!-- Viewfinder Frame overlay -->
          <div class="absolute inset-0 border-2 border-blue-500/30 pointer-events-none rounded-2xl flex flex-col justify-between p-4">
            <div class="flex justify-between">
              <div class="w-6 h-6 border-t-4 border-l-4 border-blue-500 rounded-tl-md"></div>
              <div class="w-6 h-6 border-t-4 border-r-4 border-blue-500 rounded-tr-md"></div>
            </div>
            <div class="flex justify-between">
              <div class="w-6 h-6 border-b-4 border-l-4 border-blue-500 rounded-bl-md"></div>
              <div class="w-6 h-6 border-b-4 border-r-4 border-blue-500 rounded-br-md"></div>
            </div>
          </div>
        </div>

        <div class="mt-4 flex items-center gap-3">
          <button id="btn-toggle-camera" onclick="toggleCamera()" class="px-5 py-2.5 rounded-xl bg-slate-700 hover:bg-slate-600 text-sm font-medium transition flex items-center gap-2">
            <i data-lucide="power" class="w-4 h-4 text-emerald-400"></i>
            <span id="btn-camera-text">Démarrer Caméra</span>
          </button>
          <button id="btn-switch-cam" onclick="switchCameraSource()" class="p-2.5 rounded-xl bg-slate-700 hover:bg-slate-600 text-sm font-medium transition text-slate-300 hidden" title="Changer de caméra">
            <i data-lucide="flip-horizontal" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <!-- View 2: File Upload Scan -->
      <div id="view-file" class="w-full flex flex-col items-center justify-center hidden py-8">
        <label for="qr-input-file" class="w-full aspect-square max-w-[280px] flex flex-col items-center justify-center border-2 border-dashed border-slate-600 hover:border-blue-500 bg-slate-900/50 rounded-2xl cursor-pointer transition group p-6 text-center">
          <div class="p-4 rounded-full bg-slate-800 text-slate-400 group-hover:text-blue-400 group-hover:scale-110 transition duration-300 mb-3">
            <i data-lucide="upload-cloud" class="w-8 h-8"></i>
          </div>
          <p class="text-sm font-semibold text-slate-200">Cliquez pour importer</p>
          <p class="text-xs text-slate-400 mt-1">PNG, JPG, WEBP, SVG...</p>
          <input type="file" id="qr-input-file" accept="image/*" class="hidden" onchange="scanImageFile(event)">
        </label>
      </div>

    </div>

    <!-- Result Display Section -->
    <div id="result-box" class="w-full bg-slate-800/90 border border-slate-700 rounded-3xl p-5 sm:p-6 shadow-2xl hidden transition-all duration-300">
      <div class="flex items-center justify-between pb-3 mb-4 border-b border-slate-700">
        <div class="flex items-center gap-2 text-emerald-400 font-semibold text-sm">
          <i data-lucide="check-circle" class="w-5 h-5"></i>
          <span>Résultat détecté</span>
        </div>
        <span id="badge-type" class="px-2.5 py-1 text-xs font-semibold rounded-md bg-blue-500/20 text-blue-300 border border-blue-500/30 uppercase tracking-wider">
          Texte
        </span>
      </div>

      <!-- Content Preview -->
      <div class="bg-slate-900/80 p-4 rounded-2xl border border-slate-700/60 break-all max-h-48 overflow-y-auto mb-5">
        <p id="result-text" class="text-slate-200 text-sm font-mono leading-relaxed"></p>
      </div>

      <!-- Contextual Action Buttons -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3" id="action-buttons">
        <!-- Buttons injected dynamically by JS -->
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="mt-8 text-xs text-slate-500 text-center">
    Lecteur QR Code sécurisé — Détection 100% locale dans votre navigateur
  </footer>

  <script>
    // System State Variables
    let html5QrCode = null;
    let isScanning = false;
    let currentCameraId = null;
    let availableCameras = [];
    let currentCameraIndex = 0;
    let scannedResultData = "";

    // Initialize Lucide Icons
    lucide.createIcons();

    // DOM Elements
    const viewCamera = document.getElementById('view-camera');
    const viewFile = document.getElementById('view-file');
    const tabCamera = document.getElementById('tab-camera');
    const tabFile = document.getElementById('tab-file');
    const resultBox = document.getElementById('result-box');
    const resultText = document.getElementById('result-text');
    const badgeType = document.getElementById('badge-type');
    const actionButtons = document.getElementById('action-buttons');
    const btnCameraText = document.getElementById('btn-camera-text');
    const btnSwitchCam = document.getElementById('btn-switch-cam');
    const scannerLaser = document.getElementById('scanner-laser');

    // UI Tab Switcher
    function switchTab(tab) {
      if (tab === 'camera') {
        viewCamera.classList.remove('hidden');
        viewFile.classList.add('hidden');
        tabCamera.className = "flex-1 py-2.5 px-4 rounded-xl text-sm font-semibold flex items-center justify-center gap-2 transition-all bg-blue-600 text-white shadow-lg";
        tabFile.className = "flex-1 py-2.5 px-4 rounded-xl text-sm font-semibold flex items-center justify-center gap-2 transition-all text-slate-400 hover:text-white";
      } else {
        stopCamera();
        viewCamera.classList.add('hidden');
        viewFile.classList.remove('hidden');
        tabFile.className = "flex-1 py-2.5 px-4 rounded-xl text-sm font-semibold flex items-center justify-center gap-2 transition-all bg-blue-600 text-white shadow-lg";
        tabCamera.className = "flex-1 py-2.5 px-4 rounded-xl text-sm font-semibold flex items-center justify-center gap-2 transition-all text-slate-400 hover:text-white";
      }
    }

    // Toggle Camera State
    async function toggleCamera() {
      if (isScanning) {
        await stopCamera();
      } else {
        await startCamera();
      }
    }

    // Start Live QR Scanning
    async function startCamera() {
      try {
        if (!html5QrCode) {
          html5QrCode = new Html5Qrcode("reader");
        }

        // Fetch user devices
        availableCameras = await Html5Qrcode.getCameras();
        if (availableCameras && availableCameras.length > 0) {
          // Show camera switch button if multiple cameras exist
          if (availableCameras.length > 1) {
            btnSwitchCam.classList.remove('hidden');
          }

          const cameraId = availableCameras[currentCameraIndex].id;
          
          await html5QrCode.start(
            cameraId,
            {
              fps: 15,
              qrbox: { width: 220, height: 220 }
            },
            onScanSuccess,
            onScanFailure
          );

          isScanning = true;
          btnCameraText.innerText = "Arrêter Caméra";
          scannerLaser.classList.remove('hidden');
        } else {
          showToast("Aucune caméra trouvée sur l'appareil", "error");
        }
      } catch (err) {
        console.error("Erreur d'accès à la caméra:", err);
        showToast("Impossible d'accéder à la caméra. Vérifiez vos permissions.", "error");
        await stopCamera();
      }
    }

    // Stop Camera Scan
    async function stopCamera() {
      if (html5QrCode && isScanning) {
        try {
          await html5QrCode.stop();
        } catch (e) {
          console.error(e);
        }
        isScanning = false;
      }
      btnCameraText.innerText = "Démarrer Caméra";
      scannerLaser.classList.add('hidden');
    }

    // Switch camera source (front/back)
    async function switchCameraSource() {
      if (availableCameras.length < 2) return;
      await stopCamera();
      currentCameraIndex = (currentCameraIndex + 1) % availableCameras.length;
      await startCamera();
    }

    // Callback on successful QR detection
    function onScanSuccess(decodedText, decodedResult) {
      // Vibrate if mobile device supports it
      if (navigator.vibrate) {
        navigator.vibrate(100);
      }
      processQRContent(decodedText);
    }

    function onScanFailure(error) {
      // Ignore frame read failures (normal for camera scanning stream)
    }

    // Scan Uploaded Image File
    async function scanImageFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader");
      }

      try {
        const decodedText = await html5QrCode.scanFile(file, true);
        processQRContent(decodedText);
        showToast("QR Code scanné avec succès !", "success");
      } catch (err) {
        console.error(err);
        showToast("Impossible de lire un QR Code dans cette image", "error");
      }
    }

    // Analyze and process decoded text
    function processQRContent(text) {
      scannedResultData = text;
      resultText.innerText = text;
      resultBox.classList.remove('hidden');
      actionButtons.innerHTML = ''; // Clear existing buttons

      // Smooth scroll to result
      resultBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

      // Detect Content Type & Build Actions
      if (isValidUrl(text)) {
        const fileInfo = getFileInfo(text);
        
        if (fileInfo.isFile) {
          // Case 1: Direct File Link (PDF, Image, Archive, etc.)
          badgeType.innerText = `Fichier (${fileInfo.extension.toUpperCase()})`;
          badgeType.className = "px-2.5 py-1 text-xs font-semibold rounded-md bg-purple-500/20 text-purple-300 border border-purple-500/30 uppercase tracking-wider";
          
          createDownloadButton(text, fileInfo.filename);
          createOpenLinkButton(text);
        } else {
          // Case 2: Web URL
          badgeType.innerText = "Lien Web";
          badgeType.className = "px-2.5 py-1 text-xs font-semibold rounded-md bg-blue-500/20 text-blue-300 border border-blue-500/30 uppercase tracking-wider";
          
          createOpenLinkButton(text);
          createCopyButton(text);
        }
      } else if (text.startsWith("data:")) {
        // Case 3: Data URL / Embedded File
        badgeType.innerText = "Donnée / Fichier Embraqué";
        badgeType.className = "px-2.5 py-1 text-xs font-semibold rounded-md bg-amber-500/20 text-amber-300 border border-amber-500/30 uppercase tracking-wider";
        
        createDataUrlDownloadButton(text);
        createCopyButton(text);
      } else if (text.startsWith("WIFI:")) {
        // Case 4: Wi-Fi Credentials
        badgeType.innerText = "Réseau Wi-Fi";
        badgeType.className = "px-2.5 py-1 text-xs font-semibold rounded-md bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 uppercase tracking-wider";
        
        createCopyButton(text, "Copier les identifiants");
      } else if (text.startsWith("BEGIN:VCARD")) {
        // Case 5: vCard Contact
        badgeType.innerText = "Contact vCard";
        badgeType.className = "px-2.5 py-1 text-xs font-semibold rounded-md bg-pink-500/20 text-pink-300 border border-pink-500/30 uppercase tracking-wider";
        
        createDownloadVCardButton(text);
        createCopyButton(text);
      } else {
        // Case 6: Plain Text
        badgeType.innerText = "Texte Brut";
        badgeType.className = "px-2.5 py-1 text-xs font-semibold rounded-md bg-slate-500/20 text-slate-300 border border-slate-500/30 uppercase tracking-wider";
        
        createCopyButton(text);
      }

      lucide.createIcons();
    }

    // --- Helper Functions --- //

    // Check if string is a URL
    function isValidUrl(string) {
      try {
        const url = new URL(string);
        return url.protocol === "http:" || url.protocol === "https:";
      } catch (_) {
        return false;
      }
    }

    // Check if URL points to a downloadable file extension
    function getFileInfo(urlString) {
      try {
        const url = new URL(urlString);
        const pathname = url.pathname;
        const filename = pathname.substring(pathname.lastIndexOf('/') + 1);
        const extensionMatch = filename.match(/\.([a-zA-Z0-9]+)$/);
        
        const fileExtensions = ['pdf', 'doc', 'docx', 'xls', 'xlsx', 'zip', 'rar', '7z', 'png', 'jpg', 'jpeg', 'gif', 'webp', 'mp3', 'mp4', 'csv', 'txt', 'apk'];
        
        if (extensionMatch && fileExtensions.includes(extensionMatch[1].toLowerCase())) {
          return {
            isFile: true,
            extension: extensionMatch[1],
            filename: filename || `fichier-telecharge.${extensionMatch[1]}`
          };
        }
      } catch (e) {}
      
      return { isFile: false, extension: '', filename: '' };
    }

    // Action Button Creators
    function createOpenLinkButton(url) {
      const btn = document.createElement('a');
      btn.href = url;
      btn.target = "_blank";
      btn.rel = "noopener noreferrer";
      btn.className = "w-full py-3 px-4 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-medium text-sm flex items-center justify-center gap-2 transition shadow-lg shadow-blue-600/30";
      btn.innerHTML = `<i data-lucide="external-link" class="w-4 h-4"></i> Ouvrir le lien`;
      actionButtons.appendChild(btn);
    }

    function createDownloadButton(url, filename) {
      const btn = document.createElement('a');
      btn.href = url;
      btn.download = filename;
      btn.target = "_blank";
      btn.className = "w-full py-3 px-4 rounded-xl bg-purple-600 hover:bg-purple-500 text-white font-medium text-sm flex items-center justify-center gap-2 transition shadow-lg shadow-purple-600/30";
      btn.innerHTML = `<i data-lucide="download" class="w-4 h-4"></i> Télécharger le fichier`;
      actionButtons.appendChild(btn);
    }

    function createDataUrlDownloadButton(dataUrl) {
      const btn = document.createElement('a');
      btn.href = dataUrl;
      btn.download = "qr-download-file";
      btn.className = "w-full py-3 px-4 rounded-xl bg-amber-600 hover:bg-amber-500 text-white font-medium text-sm flex items-center justify-center gap-2 transition shadow-lg shadow-amber-600/30";
      btn.innerHTML = `<i data-lucide="download" class="w-4 h-4"></i> Télécharger les données`;
      actionButtons.appendChild(btn);
    }

    function createDownloadVCardButton(vcardText) {
      const blob = new Blob([vcardText], { type: 'text/vcard' });
      const url = URL.createObjectURL(blob);
      const btn = document.createElement('a');
      btn.href = url;
      btn.download = "contact.vcf";
      btn.className = "w-full py-3 px-4 rounded-xl bg-pink-600 hover:bg-pink-500 text-white font-medium text-sm flex items-center justify-center gap-2 transition shadow-lg shadow-pink-600/30";
      btn.innerHTML = `<i data-lucide="user-plus" class="w-4 h-4"></i> Enregistrer le contact`;
      actionButtons.appendChild(btn);
    }

    function createCopyButton(text, label = "Copier le texte") {
      const btn = document.createElement('button');
      btn.type = "button";
      btn.className = "w-full py-3 px-4 rounded-xl bg-slate-700 hover:bg-slate-600 text-slate-100 font-medium text-sm flex items-center justify-center gap-2 transition";
      btn.innerHTML = `<i data-lucide="copy" class="w-4 h-4"></i> ${label}`;
      btn.onclick = () => copyToClipboard(text);
      actionButtons.appendChild(btn);
    }

    // Copy to Clipboard logic
    function copyToClipboard(text) {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(() => {
          showToast("Copié dans le presse-papier !", "success");
        }).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text) {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      document.body.appendChild(textArea);
      textArea.select();
      try {
        document.execCommand('copy');
        showToast("Copié dans le presse-papier !", "success");
      } catch (err) {
        showToast("Échec de la copie", "error");
      }
      document.body.removeChild(textArea);
    }

    // Custom Toast Notification System
    function showToast(message, type = "success") {
      const toast = document.getElementById('toast');
      const toastMessage = document.getElementById('toast-message');
      const toastIcon = document.getElementById('toast-icon');

      toastMessage.innerText = message;

      if (type === "success") {
        toastIcon.setAttribute('data-lucide', 'check-circle-2');
        toastIcon.className = 'w-5 h-5 text-emerald-400';
      } else {
        toastIcon.setAttribute('data-lucide', 'alert-circle');
        toastIcon.className = 'w-5 h-5 text-rose-400';
      }

      lucide.createIcons();

      toast.classList.remove('translate-y-[-150%]');
      toast.classList.add('translate-y-0');

      setTimeout(() => {
        toast.classList.remove('translate-y-0');
        toast.classList.add('translate-y-[-150%]');
      }, 3000);
    }
  </script>
</body>
</html>
